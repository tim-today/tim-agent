name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform CLI & GUI Applications
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: tim-agent-linux-amd64
            gui_output: TimAgent-linux-amd64-gui.tar.gz
            cgo: "0"
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: tim-agent-linux-arm64
            gui_output: TimAgent-linux-arm64-gui.tar.gz
            cgo: "0"
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: tim-agent-windows-amd64.exe
            gui_output: TimAgent-windows-amd64-gui.exe
            cgo: "0"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: tim-agent-darwin-arm64
            gui_output: TimAgent-macos-arm64.app.zip
            cgo: "1"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: tim-agent-darwin-amd64
            gui_output: TimAgent-macos-amd64.app.zip
            cgo: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Build CLI & GUI Applications
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          mkdir -p dist
          # 1. 构建标准命令行/双模可执行程序
          go build -ldflags="-s -w" -o dist/${{ matrix.output }} .

          # 2. 构建各平台鼠标双击启动的原生 GUI Application
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-s -w -H=windowsgui" -o dist/${{ matrix.gui_output }} .
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            go run . -pack-mac-app dist/TimAgent.app -pack-bin dist/${{ matrix.output }}
            cd dist && zip -r -q ${{ matrix.gui_output }} TimAgent.app && rm -rf TimAgent.app
          elif [ "${{ matrix.goos }}" = "linux" ]; then
            GOOS= GOARCH= CGO_ENABLED=0 go run . -pack-linux-app dist/TimAgent-linux-gui -pack-bin dist/${{ matrix.output }}
            cd dist && tar -czf ${{ matrix.gui_output }} TimAgent-linux-gui && rm -rf TimAgent-linux-gui
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}-bundle
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist-release -type f -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
