name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform CLI & GUI Applications
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: tim-agent-linux-amd64
            gui_output: TimAgent-linux-amd64-gui.tar.gz
            cgo: "0"
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: tim-agent-linux-arm64
            gui_output: TimAgent-linux-arm64-gui.tar.gz
            cgo: "0"
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: tim-agent-windows-amd64.exe
            gui_output: TimAgent-windows-amd64-gui.exe
            cgo: "0"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: tim-agent-darwin-arm64
            gui_output: TimAgent-macos-arm64.app.zip
            cgo: "1"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output: tim-agent-darwin-amd64
            gui_output: TimAgent-macos-amd64.app.zip
            cgo: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Build CLI & GUI Applications
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          mkdir -p dist

          if [ "${{ matrix.goos }}" = "darwin" ]; then
            # macOS 强制开启 11.0+ 向下兼容 (解决高版本 SDK 编译在旧版 macOS 报错问题)
            export MACOSX_DEPLOYMENT_TARGET=11.0
            export CGO_CFLAGS="-mmacosx-version-min=11.0"
            export CGO_LDFLAGS="-mmacosx-version-min=11.0"

            # 1. 构建对应架构 CLI 二进制
            go build -ldflags="-s -w" -o dist/${{ matrix.output }} .

            # 2. 同时编译 arm64 与 amd64 并通过 lipo 合成 Universal 双架构通用二进制放入 TimAgent.app
            # 确保无论用户在 Intel Mac 还是 Apple Silicon Mac 下载任意 .app.zip 均可 100% 正常打开！
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/tmp-arm64 .
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -ldflags="-s -w" -o dist/tmp-amd64 .
            lipo -create -output dist/tmp-universal dist/tmp-amd64 dist/tmp-arm64

            # 使用当前 runner 原生架构执行打包命令
            GOOS= GOARCH= CGO_ENABLED=1 go run . -pack-mac-app dist/TimAgent.app -pack-bin dist/tmp-universal
            rm -f dist/tmp-arm64 dist/tmp-amd64 dist/tmp-universal

            cd dist && zip -r -q ${{ matrix.gui_output }} TimAgent.app
            if [ "${{ matrix.goarch }}" = "arm64" ]; then
              cp ${{ matrix.gui_output }} TimAgent-macos-universal.app.zip
            fi
            rm -rf TimAgent.app
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags="-s -w" -o dist/${{ matrix.output }} .
            go build -ldflags="-s -w -H=windowsgui" -o dist/${{ matrix.gui_output }} .
          elif [ "${{ matrix.goos }}" = "linux" ]; then
            go build -ldflags="-s -w" -o dist/${{ matrix.output }} .
            GOOS= GOARCH= CGO_ENABLED=0 go run . -pack-linux-app dist/TimAgent-linux-gui -pack-bin dist/${{ matrix.output }}
            cd dist && tar -czf ${{ matrix.gui_output }} TimAgent-linux-gui && rm -rf TimAgent-linux-gui
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}-bundle
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist-release -type f -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
